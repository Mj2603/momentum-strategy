[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-strategy"
version = "0.2.0"
description = "Jegadeesh-Titman 12-1 cross-sectional momentum backtest on monthly prices"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21", "pandas>=2.2", "matplotlib>=3.5"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["momentum_strategy", "backtest", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
